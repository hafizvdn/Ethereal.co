<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Ethereal.co account.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <title>Ethereal.co — Sign In</title>
</head>
<body>
    <main class="auth-page">
        <span class="wordmark">Ethereal.co</span>

        <div class="auth-card">
            <h1>Sign in</h1>

            <form data-next="index2.html" method="post">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           autocomplete="email" aria-describedby="email-error" required>
                    <p class="field-error" id="email-error">Enter a valid email address.</p>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password"
                               autocomplete="current-password" aria-describedby="password-error" required>
                        <button type="button" class="password-toggle" data-target="password"
                                aria-pressed="false" aria-label="Show password">Show</button>
                    </div>
                    <p class="field-error" id="password-error">Enter your password.</p>
                </div>

                <button type="submit" class="button-block">Sign In</button>
            </form>

            <p class="auth-switch">New to Ethereal.co? <a href="index.html">Create an account</a></p>
        </div>
    </main>
</body>
</html>
